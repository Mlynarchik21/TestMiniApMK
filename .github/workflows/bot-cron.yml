name: Bot Cron

on:
  schedule:
    - cron: "*/1 * * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  manage:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/1 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call manage
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/engine/manage"

  tick:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call tick
        run: |
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_BASE_URL/api/engine/tick"