name: Bot Cron

on:
  schedule:
    - cron: "*/1 * * * *"
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  manage:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/1 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call manage
        run: |
          curl -X POST --fail --silent --show-error \
            https://test-mini-ap-mk.vercel.app/api/engine/manage

  tick:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '*/5 * * * *'
    runs-on: ubuntu-latest
    steps:
      - name: Call tick
        run: |
          curl -X POST --fail --silent --show-error \
            https://test-mini-ap-mk.vercel.app/api/engine/tick